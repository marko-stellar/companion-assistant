openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: COMPANION API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin-auth
    description: Admin authentication
  - name: admin-users
    description: Admin senior-user management
  - name: admin-companions
    description: Companion persona list
  - name: admin-dashboard
    description: Admin dashboard statistics
  - name: admin-device
    description: Tablet device assignment management
  - name: tablet
    description: Tablet-facing API (Bearer token auth)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /admin/auth/login:
    post:
      operationId: loginAdmin
      tags: [admin-auth]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/auth/logout:
    post:
      operationId: logoutAdmin
      tags: [admin-auth]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /admin/auth/me:
    get:
      operationId: getAdminMe
      tags: [admin-auth]
      summary: Get current admin session
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Dashboard ─────────────────────────────────────────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin-dashboard]
      summary: Dashboard statistics
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ── Companions ────────────────────────────────────────────────────────────
  /admin/companions:
    get:
      operationId: listAdminCompanions
      tags: [admin-companions]
      summary: List all companion personas
      responses:
        "200":
          description: Companion list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Companion"

  # ── Users ─────────────────────────────────────────────────────────────────
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin-users]
      summary: List senior users
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Filter by name
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserListItem"
    post:
      operationId: createAdminUser
      tags: [admin-users]
      summary: Create a senior user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}:
    get:
      operationId: getAdminUser
      tags: [admin-users]
      summary: Get senior user detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAdminUser
      tags: [admin-users]
      summary: Update a senior user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/emergency-contact:
    get:
      operationId: getEmergencyContact
      tags: [admin-users]
      summary: Get emergency contact for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Emergency contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyContact"
        "404":
          description: None configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertEmergencyContact
      tags: [admin-users]
      summary: Create or replace emergency contact
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyContactInput"
      responses:
        "200":
          description: Saved emergency contact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmergencyContact"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/dnd:
    get:
      operationId: getDndPeriod
      tags: [admin-users]
      summary: Get DND period for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: DND period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DndPeriod"
        "404":
          description: None configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: upsertDndPeriod
      tags: [admin-users]
      summary: Create or replace DND period
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DndPeriodInput"
      responses:
        "200":
          description: Saved DND period
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DndPeriod"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin device assignment ───────────────────────────────────────────────
  /admin/users/{id}/device-status:
    get:
      operationId: getDeviceStatus
      tags: [admin-device]
      summary: Get device assignment status for a senior
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceStatus"

  /admin/users/{id}/device-code:
    post:
      operationId: generateDeviceCode
      tags: [admin-device]
      summary: Generate a one-time device setup code for a senior
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Generated code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCode"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/device-session:
    delete:
      operationId: revokeDeviceSession
      tags: [admin-device]
      summary: Revoke active device session for a senior
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "404":
          description: No active session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Tablet ────────────────────────────────────────────────────────────────
  /admin/users/{id}/reminders:
    get:
      operationId: listAdminReminders
      tags: [admin-scheduling]
      summary: List reminders for a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [GENERAL, MEDICATION]
      responses:
        "200":
          description: Reminder list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RemindersResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminReminder
      tags: [admin-scheduling]
      summary: Create a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reminders/{id}:
    get:
      operationId: getAdminReminder
      tags: [admin-scheduling]
      summary: Get a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAdminReminder
      tags: [admin-scheduling]
      summary: Update a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdateRequest"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminReminder
      tags: [admin-scheduling]
      summary: Deactivate a reminder (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/reminders/{id}/occurrences:
    get:
      operationId: listAdminReminderOccurrences
      tags: [admin-scheduling]
      summary: Next upcoming occurrences of a reminder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Upcoming occurrences (next 7)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccurrencesResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users/{id}/appointments:
    get:
      operationId: listAdminAppointments
      tags: [admin-scheduling]
      summary: List appointments for a user (active only by default)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: active
          in: query
          schema:
            type: string
            enum: [all]
          description: Pass "all" to include deactivated appointments
      responses:
        "200":
          description: Appointment list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentsResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminAppointment
      tags: [admin-scheduling]
      summary: Create an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/appointments/{id}:
    get:
      operationId: getAdminAppointment
      tags: [admin-scheduling]
      summary: Get an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAdminAppointment
      tags: [admin-scheduling]
      summary: Update an appointment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppointmentUpdateRequest"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminAppointment
      tags: [admin-scheduling]
      summary: Deactivate an appointment (soft delete)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tablet/setup:
    post:
      operationId: tabletSetup
      tags: [tablet]
      summary: Consume a one-time setup code and claim a device session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TabletSetupInput"
      responses:
        "200":
          description: Device session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabletSetupResponse"
        "400":
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tablet/me:
    get:
      operationId: getTabletMe
      tags: [tablet]
      summary: Get current device context (user + companion + DND)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TabletContext"
        "401":
          description: Token invalid or revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tablet/today:
    get:
      operationId: getTabletToday
      tags: [tablet]
      summary: Get today's reminders and appointments
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Today's items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayResponse"
        "401":
          description: Token invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tablet/occurrences/{id}/respond:
    post:
      operationId: respondToOccurrence
      tags: [tablet]
      summary: Record a medication confirmation (YES/NO/UNKNOWN) on a triggered occurrence
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccurrenceRespondRequest"
      responses:
        "200":
          description: Response recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid response value or non-medication reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Occurrence not found or not owned by this device's user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Occurrence not awaiting a response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Trusted news sources ───────────────────────────────────────────────────
  /admin/news-sources:
    get:
      operationId: getAdminNewsSources
      tags: [newsSources]
      summary: List trusted news sources
      security:
        - adminSession: []
      responses:
        "200":
          description: All news sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSourceList"
    post:
      operationId: createAdminNewsSource
      tags: [newsSources]
      summary: Create a trusted news source
      security:
        - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsSourceCreateInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSourceResponse"
        "400":
          description: Invalid input (missing name or invalid URL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/news-sources/{id}:
    patch:
      operationId: updateAdminNewsSource
      tags: [newsSources]
      summary: Update or enable/disable a trusted news source
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewsSourceUpdateInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsSourceResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: News source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminNewsSource
      tags: [newsSources]
      summary: Delete a trusted news source
      security:
        - adminSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: News source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    adminSession:
      type: apiKey
      in: cookie
      name: connect.sid
      description: Admin session cookie set by POST /admin/auth/login
  schemas:
    # ── Common ───────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ── Auth ─────────────────────────────────────────────────────────────────
    AdminLoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 1

    AdminUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: ["string", "null"]

    # ── Dashboard ─────────────────────────────────────────────────────────────
    DashboardStats:
      type: object
      required: [totalUsers, activeUsers, companionDistribution]
      properties:
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        companionDistribution:
          type: array
          items:
            $ref: "#/components/schemas/CompanionCount"

    CompanionCount:
      type: object
      required: [companionName, count]
      properties:
        companionId:
          type: ["string", "null"]
        companionName:
          type: string
        count:
          type: integer

    # ── Companions ────────────────────────────────────────────────────────────
    Companion:
      type: object
      required: [id, name, gender, isActive]
      properties:
        id:
          type: string
        name:
          type: string
        gender:
          type: string
        tagline:
          type: ["string", "null"]
        isActive:
          type: boolean

    # ── Users ─────────────────────────────────────────────────────────────────
    UserListItem:
      type: object
      required: [id, displayName, timezone, language, isActive, createdAt]
      properties:
        id:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        displayName:
          type: string
        timezone:
          type: string
        language:
          type: string
        isActive:
          type: boolean
        companionId:
          type: ["string", "null"]
        companionName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    UserDetail:
      type: object
      required: [id, displayName, timezone, language, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        displayName:
          type: string
        preferredFormOfAddress:
          type: ["string", "null"]
        timezone:
          type: string
        language:
          type: string
        isActive:
          type: boolean
        companionId:
          type: ["string", "null"]
        companion:
          $ref: "#/components/schemas/Companion"
        deviceIdentifier:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [firstName, lastName, timezone, language]
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        preferredFormOfAddress:
          type: string
        timezone:
          type: string
          minLength: 1
        language:
          type: string
          enum: [hr, en]
        companionId:
          type: string
        deviceIdentifier:
          type: string
        isActive:
          type: boolean

    UserUpdate:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        preferredFormOfAddress:
          type: ["string", "null"]
        timezone:
          type: string
        language:
          type: string
          enum: [hr, en]
        companionId:
          type: ["string", "null"]
        deviceIdentifier:
          type: ["string", "null"]
        isActive:
          type: boolean

    # ── Emergency Contact ─────────────────────────────────────────────────────
    EmergencyContact:
      type: object
      required: [id, userId, name, phone, isPrimary, isActive, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        name:
          type: string
        phone:
          type: string
        relationship:
          type: ["string", "null"]
        isPrimary:
          type: boolean
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EmergencyContactInput:
      type: object
      required: [name, phone]
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 5
        relationship:
          type: string
        isActive:
          type: boolean

    # ── DND ───────────────────────────────────────────────────────────────────
    DndPeriod:
      type: object
      required: [id, userId, startTime, endTime, isActive, recurrenceDays, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: ["string", "null"]
        startTime:
          type: string
          description: Local HH:MM, e.g. "22:00"
        endTime:
          type: string
          description: Local HH:MM, e.g. "07:00"
        recurrenceDays:
          type: array
          items:
            type: string
          description: "Day names e.g. Mon,Tue — empty = every day"
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DndPeriodInput:
      type: object
      required: [startTime, endTime]
      properties:
        label:
          type: string
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local HH:MM
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
          description: Local HH:MM — may be before startTime for overnight DND
        recurrenceDays:
          type: array
          items:
            type: string
        isActive:
          type: boolean

    # ── Device assignment ──────────────────────────────────────────────────────
    DeviceStatus:
      type: object
      required: [hasActiveSession, hasPendingCode]
      properties:
        hasActiveSession:
          type: boolean
        lastSeenAt:
          type: ["string", "null"]
          format: date-time
        hasPendingCode:
          type: boolean
        codeExpiresAt:
          type: ["string", "null"]
          format: date-time

    DeviceCode:
      type: object
      required: [code, expiresAt]
      properties:
        code:
          type: string
          description: 6-character alphanumeric setup code
        expiresAt:
          type: string
          format: date-time

    # ── Tablet ────────────────────────────────────────────────────────────────
    TabletSetupInput:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 8

    TabletUser:
      type: object
      required: [id, displayName, timezone, language, isActive]
      properties:
        id:
          type: string
        firstName:
          type: ["string", "null"]
        displayName:
          type: string
        preferredFormOfAddress:
          type: ["string", "null"]
        timezone:
          type: string
        language:
          type: string
        isActive:
          type: boolean

    TabletSetupResponse:
      type: object
      required: [token, user, companion]
      properties:
        token:
          type: string
          description: Long-lived device token to store in localStorage
        user:
          $ref: "#/components/schemas/TabletUser"
        companion:
          $ref: "#/components/schemas/Companion"

    TabletContext:
      type: object
      required: [user, companion]
      properties:
        user:
          $ref: "#/components/schemas/TabletUser"
        companion:
          $ref: "#/components/schemas/Companion"
        dnd:
          $ref: "#/components/schemas/DndPeriod"

    Reminder:
      type: object
      required: [id, userId, title, type, localTime, recurrenceDays, isActive]
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [GENERAL, MEDICATION]
        medicationName:
          type: string
          nullable: true
        localTime:
          type: string
          description: "Local HH:MM in the user's timezone"
        recurrenceDays:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
          description: "Empty array = one-time reminder (uses localDate)"
        localDate:
          type: string
          nullable: true
          description: "YYYY-MM-DD for one-time reminders"
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    ReminderCreateRequest:
      type: object
      required: [title, localTime]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [GENERAL, MEDICATION]
        medicationName:
          type: string
          nullable: true
        localTime:
          type: string
          description: "Local HH:MM (24h)"
        recurrenceDays:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        localDate:
          type: string
          nullable: true
          description: "YYYY-MM-DD; required when recurrenceDays is empty"

    ReminderUpdateRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [GENERAL, MEDICATION]
        medicationName:
          type: string
          nullable: true
        localTime:
          type: string
        recurrenceDays:
          type: array
          items:
            type: string
            enum: [MON, TUE, WED, THU, FRI, SAT, SUN]
        localDate:
          type: string
          nullable: true
        isActive:
          type: boolean

    RemindersResponse:
      type: object
      required: [reminders, total]
      properties:
        reminders:
          type: array
          items:
            $ref: "#/components/schemas/Reminder"
        total:
          type: integer

    ReminderResponse:
      type: object
      required: [reminder]
      properties:
        reminder:
          $ref: "#/components/schemas/Reminder"

    ReminderOccurrence:
      type: object
      required: [id, reminderId, scheduledForUtc]
      properties:
        id:
          type: string
        reminderId:
          type: string
        scheduledForUtc:
          type: string
        triggeredAt:
          type: string
          nullable: true
        response:
          type: string
          nullable: true
          enum: [YES, NO, UNKNOWN, NOT_REQUIRED, null]
        respondedAt:
          type: string
          nullable: true

    OccurrencesResponse:
      type: object
      required: [occurrences]
      properties:
        occurrences:
          type: array
          items:
            $ref: "#/components/schemas/ReminderOccurrence"

    Appointment:
      type: object
      required: [id, userId, title, startsAtUtc, isActive]
      properties:
        id:
          type: string
        userId:
          type: string
        title:
          type: string
        details:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startsAtUtc:
          type: string
        endsAtUtc:
          type: string
          nullable: true
        reminderMinutesBefore:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    AppointmentCreateRequest:
      type: object
      required: [title, startsAtUtc]
      properties:
        title:
          type: string
        details:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startsAtUtc:
          type: string
          description: "ISO timestamp (UTC)"
        endsAtUtc:
          type: string
          nullable: true
        reminderMinutesBefore:
          type: integer
          nullable: true
          description: "null = no pre-alert"

    AppointmentUpdateRequest:
      type: object
      properties:
        title:
          type: string
        details:
          type: string
          nullable: true
        location:
          type: string
          nullable: true
        startsAtUtc:
          type: string
        endsAtUtc:
          type: string
          nullable: true
        reminderMinutesBefore:
          type: integer
          nullable: true
          description: "null = clear the pre-alert"
        isActive:
          type: boolean

    AppointmentsResponse:
      type: object
      required: [appointments, total]
      properties:
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        total:
          type: integer

    AppointmentResponse:
      type: object
      required: [appointment]
      properties:
        appointment:
          $ref: "#/components/schemas/Appointment"

    TodayItem:
      type: object
      required: [id, type, title, time, done]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [reminder, medication, appointment]
        title:
          type: string
        time:
          type: string
          description: "Local HH:MM"
        done:
          type: boolean
        occurrenceId:
          type: string
          description: "Reminder occurrence ID (present for reminder/medication items)"
        reminderMinutesBefore:
          type: integer
          description: "Minutes before start to surface a pre-alert (appointments only)"
        startsAtUtc:
          type: string
          description: "ISO UTC timestamp of appointment start (appointments only)"

    AppointmentAlert:
      type: object
      required: [id, title, startsAtUtc, reminderMinutesBefore]
      properties:
        id:
          type: string
        title:
          type: string
        startsAtUtc:
          type: string
          description: "ISO UTC timestamp of the appointment start"
        reminderMinutesBefore:
          type: integer
          description: "The configured reminder window (minutes)"

    # ── Trusted news sources ─────────────────────────────────────────────────
    NewsSource:
      type: object
      required: [id, name, language, isActive, trustScore]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        language:
          type: string
        isActive:
          type: boolean
        trustScore:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    NewsSourceList:
      type: object
      required: [sources, total]
      properties:
        sources:
          type: array
          items:
            $ref: "#/components/schemas/NewsSource"
        total:
          type: integer

    NewsSourceResponse:
      type: object
      required: [source]
      properties:
        source:
          $ref: "#/components/schemas/NewsSource"

    NewsSourceCreateInput:
      type: object
      required: [name, url]
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
          description: "Base website URL of the outlet (e.g. https://www.bbc.com). Its domain becomes the allowlist entry."
        category:
          type: string
        language:
          type: string
          enum: [en, hr]
        isActive:
          type: boolean
        trustScore:
          type: integer
          minimum: 1
          maximum: 10

    NewsSourceUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        url:
          type: string
          minLength: 1
        category:
          type: ["string", "null"]
        language:
          type: string
          enum: [en, hr]
        isActive:
          type: boolean
        trustScore:
          type: integer
          minimum: 1
          maximum: 10

    OccurrenceRespondRequest:
      type: object
      required: [response]
      properties:
        response:
          type: string
          enum: [YES, NO, UNKNOWN]

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    TodayResponse:
      type: object
      required: [items, upcomingAlerts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TodayItem"
        upcomingAlerts:
          type: array
          description: "Appointments currently within their reminder window (may span day boundary)"
          items:
            $ref: "#/components/schemas/AppointmentAlert"
